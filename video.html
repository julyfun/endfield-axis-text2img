<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>终末地战斗轴 · 动态预览</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="video.css">
  <script src="vendor/papaparse.min.js" defer></script>
  <script src="vendor/toml.min.js" defer></script>
  <script src="app.js?video" defer></script>
  <script src="video.js" defer></script>
  <script src="video-page.js" defer></script>
</head>
<body class="video-page">
  <header class="masthead">
    <div class="brand"><span class="brand-mark">/ /</span><span>ENDFIELD <b>AXIS</b></span></div>
    <span class="version">DYNAMIC TIMELINE / VIDEO PREVIEW</span>
  </header>
  <main class="video-workspace">
    <section class="video-editor">
      <div class="section-heading"><span class="index">01 / INPUT</span><h1>动态技能轴</h1></div>
      <p class="field-label">CSV <span>operator · action · time · note</span></p>
      <textarea id="source" spellcheck="false" aria-label="技能顺序 CSV"></textarea>
      <p class="field-label config-label">TOML <span>视频参数</span></p>
      <textarea id="poster-config" class="config-source" spellcheck="false" aria-label="视频 TOML"></textarea>
      <div class="video-actions">
        <label class="button button-secondary" for="video-file">导入 CSV</label>
        <input id="video-file" type="file" accept=".csv,text/csv,text/plain" hidden>
        <label class="button button-secondary" for="video-config-file">导入 TOML</label>
        <input id="video-config-file" type="file" accept=".toml,text/plain" hidden>
      </div>
      <p class="status" id="status" role="status"></p>
    </section>
    <section class="video-preview">
      <div class="preview-toolbar">
        <div><span class="index">02 / PREVIEW</span><h2>运行时间轴</h2></div>
        <span class="video-readout" id="video-readout">0.00 / 0.00 SEC</span>
      </div>
      <div class="video-canvas-wrap"><canvas id="poster" aria-label="动态技能时间轴"></canvas></div>
      <div class="video-controls">
        <button class="button button-primary" id="video-play" type="button">播放</button>
        <button class="button button-secondary" id="video-reset" type="button">重置</button>
        <input id="video-progress" type="range" min="0" max="0" step="0.001" value="0" aria-label="视频进度">
      </div>
      <p class="status" id="video-status" role="status"></p>
      <pre class="error-details" id="error-details" hidden></pre>
    </section>
  </main>
  <button id="render" hidden type="button"></button><button id="download" hidden type="button"></button>
</body>
</html>
