<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>终末地战斗轴 · 一图流</title>
  <link rel="stylesheet" href="style.css">
  <script src="editor-panel.js" defer></script>
  <script src="vendor/papaparse.min.js" defer></script>
  <script src="vendor/toml.min.js" defer></script>
  <script src="app.js?v=2" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="brand"><span class="brand-mark">/ /</span><span>ENDFIELD <b>AXIS</b></span></div>
    <span class="version">TACTICAL SEQUENCE / 01</span>
  </header>

  <main class="workspace">
    <section class="editor" data-editor-panel data-editor-mode="poster" aria-label="技能顺序编辑器"></section>

    <section class="preview" aria-label="图片预览">
      <div class="preview-toolbar">
        <div><span class="index">02 / OUTPUT</span><h2>成品预览</h2></div>
        <div class="preview-actions"><a class="button button-secondary" href="video.html">动态预览</a><button class="button button-download" id="download" type="button">下载 PNG <span aria-hidden="true">↓</span></button></div>
      </div>
      <div class="canvas-wrap"><canvas id="poster" aria-label="技能顺序图片"></canvas></div>
      <p class="preview-meta"><span id="dimensions">1440 × 1920 PX</span><span>PNG / 高清输出</span></p>
    </section>
  </main>
</body>
</html>
