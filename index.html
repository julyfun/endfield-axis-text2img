<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>终末地战斗轴 · 一图流</title>
  <link rel="stylesheet" href="style.css">
  <script src="vendor/js-yaml.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="brand"><span class="brand-mark">/ /</span><span>ENDFIELD <b>AXIS</b></span></div>
    <span class="version">TACTICAL SEQUENCE / 01</span>
  </header>

  <main class="workspace">
    <section class="editor" aria-label="YAML 编辑器">
      <div class="section-heading"><span class="index">01 / INPUT</span><h1>技能顺序</h1></div>
      <p class="field-label">YAML <span>干员 · 动作 · 标签 · 时间 · 属性 · 备注</span></p>
      <textarea id="source" spellcheck="false" aria-label="技能顺序 YAML"></textarea>
      <div class="editor-actions">
        <label class="button button-secondary" for="file">导入 YAML</label>
        <input id="file" type="file" accept=".yaml,.yml,text/yaml,text/plain" hidden>
        <button class="button button-primary" id="render" type="button">生成预览 <span aria-hidden="true">↗</span></button>
      </div>
      <p class="status" id="status" role="status"></p>
      <div class="editor-foot"><span>UTF-8</span><span id="row-seconds">10 SEC / LINE</span><span>时间倒序</span></div>
    </section>

    <section class="preview" aria-label="图片预览">
      <div class="preview-toolbar">
        <div><span class="index">02 / OUTPUT</span><h2>成品预览</h2></div>
        <button class="button button-download" id="download" type="button">下载 PNG <span aria-hidden="true">↓</span></button>
      </div>
      <div class="canvas-wrap"><canvas id="poster" aria-label="技能顺序图片"></canvas></div>
      <p class="preview-meta"><span id="dimensions">1440 × 1920 PX</span><span>PNG / 高清输出</span></p>
    </section>
  </main>
</body>
</html>
