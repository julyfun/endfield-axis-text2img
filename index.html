<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>终末地战斗轴 · 一图流</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="brand"><span class="brand-mark">/ /</span><span>ENDFIELD <b>AXIS</b></span></div>
    <span class="version">TACTICAL SEQUENCE / 01</span>
  </header>

  <main class="workspace">
    <section class="editor" aria-label="CSV 编辑器">
      <div class="section-heading"><span class="index">01 / INPUT</span><h1>技能顺序</h1></div>
      <p class="field-label">CSV / TSV <span>operator · action · label · time · note</span></p>
      <textarea id="csv" spellcheck="false" aria-label="技能顺序 CSV">operator,action,label,time,note
赛希,skill,战技,:57,
祀,skill,战技,:56,
诀,combo,连携,:56,
祀,skill,拉球,:54,
赛希,attack,重击,:54,
诀,switch,切人,:54,
祀,skill,丢球,:52,
祀,skill,战技,:51,
祀,skill,拉球,:51,
诀,attack,重击,:51,
赛希,combo,连携,:50,
诀,skill,战技,:47,"四腐蚀，别放葱连携"
提弗洛斯,attack,普通三段,,
提弗洛斯,skill,战技,:47,
赛希,ultimate,大招,,
提弗洛斯,attack,四箭,:43,
祀,combo,连携,:42,
提弗洛斯,combo,连携,:42,
诀,skill,战技,:42,
祀,ultimate,大招,:39,
诀,skill,战技,:38,
诀,combo,连携,:37,
诀,ultimate,大招,,
提弗洛斯,attack,四箭,,
提弗洛斯,combo,连携,,
提弗洛斯,attack,五箭,:32,
祀,skill,丢球,,</textarea>
      <div class="editor-actions">
        <label class="button button-secondary" for="file">导入 CSV</label>
        <input id="file" type="file" accept=".csv,.tsv,text/csv,text/tab-separated-values,text/plain" hidden>
        <button class="button button-primary" id="render" type="button">生成预览 <span aria-hidden="true">↗</span></button>
      </div>
      <p class="status" id="status" role="status"></p>
      <div class="editor-foot"><span>UTF-8</span><span>10 SEC / LINE</span><span>时间倒序</span></div>
    </section>

    <section class="preview" aria-label="图片预览">
      <div class="preview-toolbar">
        <div><span class="index">02 / OUTPUT</span><h2>成品预览</h2></div>
        <button class="button button-download" id="download" type="button">下载 PNG <span aria-hidden="true">↓</span></button>
      </div>
      <div class="canvas-wrap"><canvas id="poster" aria-label="技能顺序图片"></canvas></div>
      <p class="preview-meta"><span id="dimensions">1440 × 1920 PX</span><span>PNG / 高清输出</span></p>
    </section>
  </main>
</body>
</html>
